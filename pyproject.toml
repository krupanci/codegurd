[project]
name = "codeguard"
version = "0.1.0"
description = "Codebase analysis and dependency graph tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gitpython",
    "lancedb",
    "tree-sitter",
    "tree-sitter-python",
    "typer",
    "pyarrow",
    "pydantic",
    "pydantic-settings",
    "sentence-transformers",
]

[project.scripts]
codeguard = "codeguard.cli:app"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"